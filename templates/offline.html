{% extends "base.html" %}
{% block title %}Oflayn — Olimlar.uz{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;">
  <div style="max-width:500px;">
    <div style="font-size:5rem;margin-bottom:16px;"><i class="bi bi-wifi-off" aria-hidden="true"></i></div>
    <h1 style="color:var(--color-text-primary);font-size:2rem;font-weight:600;margin-bottom:12px;">Internet aloqasi yo'q</h1>
    <p style="color:var(--color-action);font-size:1rem;line-height:1.6;margin-bottom:24px;">
      Hozirda internet aloqangiz yo'q. Iltimos, aloqani tekshirib qaytadan urinib ko'ring.
    </p>
    <button onclick="location.reload()" style="background:var(--color-action);color:var(--color-white);padding:12px 28px;border-radius:var(--radius-default);border:none;font-weight:600;font-size:1rem;cursor:pointer;">
       Qayta urinish
    </button>
  </div>
</div>
{% endblock %}
