name: OAK kunlik scraper
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oak-daily-scraper
  cancel-in-progress: false

jobs:
  scrape_and_send:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v6

      - name: Python o'rnatish
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # last_state.json runtime fayl bo'lgani uchun Git'da saqlanmaydi.
      # Eng so'nggi muvaffaqiyatli watermark va qayta uriniladigan yozuvlarni
      # branch bo'yicha Actions cache'dan tiklaymiz.
      - name: Scraper holatini tiklash
        uses: actions/cache/restore@v5
        with:
          path: |
            last_state.json
            retry_items.json
          key: oak-scraper-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            oak-scraper-state-${{ github.ref_name }}-

      - name: Kutubxonalar o'rnatish
        run: pip install requests beautifulsoup4 psycopg2-binary

      # Eski bulk importlar SERIAL sequence'ni MAX(id) dan ortda qoldirgan
      # bo'lishi mumkin. Shunda mavjud yozuvlar update bo'ladi, ammo yangi OAK
      # yozuvi duplicate primary key bilan yiqiladi.
      - name: Dissertatsiya ID sequence'ni tekislash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/repair_dissertation_sequence.py

      - name: Scraper ishga tushirish
        run: python scraper.py

      - name: Saytga yuborish
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_API_KEY: ${{ secrets.SITE_API_KEY }}
        run: python send_to_site.py

      # Faqat scraping va yuborish muvaffaqiyatli tugagach yangi snapshot
      # yaratiladi. GitHub cache o'zgarmas bo'lgani uchun run_id noyob kalitdir;
      # keyingi run restore-keys orqali eng yangi snapshotni oladi.
      - name: Scraper holatini saqlash
        uses: actions/cache/save@v5
        with:
          path: |
            last_state.json
            retry_items.json
          key: oak-scraper-state-${{ github.ref_name }}-${{ github.run_id }}

      # Chat retention — 3 kundan eski yozishmalarni global tozalash (idempotent).
      # Lazy tozalash send/GET da ham ishlaydi; bu esa jim suhbatlarni ham tozalaydi.
      - name: Eski yozishmalarni tozalash (3 kun)
        env:
          REMINDERS_API_KEY: ${{ secrets.REMINDERS_API_KEY }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "X-API-Key: ${REMINDERS_API_KEY}" \
            https://www.olimlar.uz/api/v1/messages/cleanup || true
